name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: srinamo
          POSTGRES_PASSWORD: srinamo_test
          POSTGRES_DB: srinamo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U srinamo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://srinamo:srinamo_test@localhost:5432/srinamo_test
      JWT_SECRET: ci-test-secret-not-the-sample-value-32
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r backend/requirements.txt
      - name: Create schema and admin
        working-directory: backend
        run: python seed.py
      - name: Pytest
        working-directory: backend
        run: python -m pytest -q
